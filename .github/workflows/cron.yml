name: Portfolio News Cron (Backup)

on:
  schedule:
    - cron: '0 12 * * 1-5'
  workflow_dispatch:
    inputs:
      test_run:
        description: 'Run a test deployment'
        required: false
        default: 'false'

jobs:
  run-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run cron job
        run: |
          cd api
          python -c "
import sys
sys.path.insert(0, '.')
from cron import handler
import json
import os

request = {'headers': {}, 'query': {}, 'body': None, 'method': 'GET'}
if os.getenv('CRON_SECRET'):
    request['headers']['Authorization'] = 'Bearer ' + os.getenv('CRON_SECRET')

result = handler(request)
print(json.dumps(result, indent=2))
"

      - name: Log result
        if: always()
        run: echo "Cron job completed"
